name: Synups monitoring
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: synups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: synups/global.json
      - run: dotnet restore ../Synups.slnx --locked-mode
      - run: dotnet build ../Synups.slnx -c Release --no-restore
      - run: dotnet test ../Synups.slnx -c Release --no-build --logger trx --results-directory ../artifacts/tests
      - name: Explicit real loopback ICMP integration
        run: dotnet test ../Synups.slnx -c Release --no-build --filter FullyQualifiedName~RealLoopback --logger trx --results-directory ../artifacts/real-network
        env:
          SYNUPS_REAL_NETWORK_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/
